[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "system-one-dwarf"
version = "0.1.0"
description = "Autoplay de Dwarf Fortress (adventure mode) controlado por DFHack + frota de decisões JEV."
readme = "docs/arquitetura.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    # Ruído de import do TestClient (fastapi -> starlette.testclient): o aviso é
    # da ferramenta de teste, não do projeto (identificado na suite, 2026-10).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
